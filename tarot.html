<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot — TeamSparkAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --tarot-deep:   #06080f;
      --tarot-dark:   #0d0f1a;
      --tarot-mid:    #141828;
      --tarot-gold:   #c8943a;
      --tarot-light:  #e8dfc8;
      --tarot-dim:    rgba(232,223,200,0.55);
      --tarot-purple: #6b4fa0;
      --tarot-rose:   #a04f6b;
    }

    body {
      background: var(--tarot-deep);
      color: var(--tarot-light);
    }

    /* HERO */
    .tarot-hero {
      min-height: 50vh;
      background: radial-gradient(ellipse at 50% 60%, rgba(107,79,160,0.18) 0%, transparent 65%),
                  radial-gradient(ellipse at 30% 30%, rgba(200,148,58,0.10) 0%, transparent 55%),
                  var(--tarot-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
    }

    .tarot-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.5rem, 10vw, 7rem);
      color: var(--tarot-gold);
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .tarot-hero p {
      color: var(--tarot-dim);
      font-style: italic;
      font-size: 1.05rem;
      max-width: 480px;
      margin: 0 auto;
    }

    /* SPREADS */
    .spread-controls {
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 2rem 1rem;
      text-align: center;
    }

    .spread-label {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--tarot-gold);
      margin-bottom: 1.2rem;
      display: block;
    }

    .spread-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .spread-btn {
      background: transparent;
      border: 1px solid rgba(200,148,58,0.35);
      color: var(--tarot-light);
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      padding: 0.65rem 1.4rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .spread-btn:hover,
    .spread-btn.active {
      background: rgba(200,148,58,0.12);
      border-color: var(--tarot-gold);
    }

    .draw-btn {
      background: rgba(200,148,58,0.15);
      border: 1px solid var(--tarot-gold);
      color: var(--tarot-gold);
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-style: italic;
      padding: 0.9rem 2.8rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.05em;
    }

    .draw-btn:hover {
      background: rgba(200,148,58,0.28);
    }

    /* READING AREA */
    .reading-area {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 2rem 5rem;
    }

    .cards-row {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    /* CARD */
    .card {
      width: 180px;
      flex-shrink: 0;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card-face {
      background: linear-gradient(160deg, #1a1428 0%, #0d0f1a 100%);
      border: 1px solid rgba(200,148,58,0.3);
      border-radius: 6px;
      padding: 1.5rem 1rem 1rem;
      text-align: center;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      position: relative;
    }

    .card-face.reversed {
      border-color: rgba(160,79,107,0.4);
    }

    .card-glyph {
      font-size: 2.8rem;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      color: var(--tarot-gold);
      line-height: 1.3;
      margin-bottom: 0.3rem;
    }

    .card-number {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--tarot-dim);
    }

    .card-reversed-tag {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--tarot-rose);
      margin-top: 0.4rem;
    }

    .card-position {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(200,148,58,0.5);
      margin-top: 0.6rem;
      text-align: center;
    }

    /* MEANING */
    .card-meaning {
      background: var(--tarot-mid);
      border-left: 2px solid var(--tarot-gold);
      border-radius: 0 4px 4px 0;
      padding: 1.2rem 1.5rem;
      margin-top: 1rem;
    }

    .card-meaning.reversed {
      border-left-color: var(--tarot-rose);
    }

    .card-meaning p {
      font-size: 0.88rem;
      line-height: 1.75;
      color: rgba(232,223,200,0.8);
      margin: 0;
    }

    .reading-note {
      text-align: center;
      color: var(--tarot-dim);
      font-style: italic;
      font-size: 0.88rem;
      margin-top: 1rem;
    }

    /* empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--tarot-dim);
      font-style: italic;
    }

    .empty-state .sigil {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    @media (max-width: 520px) {
      .card { width: 140px; }
      .card-face { min-height: 210px; padding: 1rem 0.75rem; }
      .card-glyph { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <section class="tarot-hero">
    <div>
      <h1>Tarot</h1>
      <p>Ask nothing. Ask everything. The cards hear both.</p>
    </div>
  </section>

  <div class="spread-controls">
    <span class="spread-label">choose your spread</span>
    <div class="spread-buttons">
      <button class="spread-btn active" data-spread="1">Single Card</button>
      <button class="spread-btn" data-spread="3">Past · Present · Future</button>
      <button class="spread-btn" data-spread="5">Five Card Cross</button>
    </div>
    <button class="draw-btn" id="drawBtn">Draw the Cards</button>
  </div>

  <div class="reading-area">
    <div class="empty-state" id="emptyState">
      <span class="sigil">✦</span>
      <p>The deck is waiting.</p>
    </div>
    <div class="cards-row" id="cardsRow" style="display:none"></div>
    <p class="reading-note" id="readingNote" style="display:none"></p>
  </div>

  <nav class="house-nav">
    <span class="house-nav-label">rooms in the house</span>
    <div class="house-nav-rooms">
      <a href="index.html">the house</a>
      <a href="spark.html">spark</a>
      <a href="ajah.html">ajah's palace</a>
      <a href="seraphina.html">seraphina</a>
      <a href="hawkie.html">hawk</a>
      <a href="haunted.html">haunted things</a>
      <a href="vega-altair-love.html">vega &amp; altair</a>
      <a href="tarot.html" class="here">tarot</a>
    </div>
  </nav>

  <script>
    const MAJOR = [
      { name: "The Fool",          num: "0",        glyph: "🌬️", up: "New beginnings, innocence, spontaneity, a free spirit stepping into the unknown with faith.", rev: "Recklessness, risk-taking without grounding, naivety used against you." },
      { name: "The Magician",      num: "I",        glyph: "🪄", up: "Willpower, desire, creation, manifestation. You have all the tools you need.", rev: "Manipulation, poor planning, latent talents not being used." },
      { name: "The High Priestess",num: "II",       glyph: "🌙", up: "Intuition, sacred knowledge, the subconscious mind. Listen to what is not spoken.", rev: "Secrets, disconnection from intuition, withdrawal." },
      { name: "The Empress",       num: "III",      glyph: "🌿", up: "Femininity, beauty, nature, abundance, nurturing. Something is growing.", rev: "Creative block, dependence, smothering." },
      { name: "The Emperor",       num: "IV",       glyph: "⚖️", up: "Authority, establishment, structure, a father figure. Stability and power.", rev: "Domination, excessive control, rigidity, inflexibility." },
      { name: "The Hierophant",    num: "V",        glyph: "🏛️", up: "Spiritual wisdom, religious belief, conformity, tradition, institutions.", rev: "Personal beliefs challenged, freedom from convention, subversiveness." },
      { name: "The Lovers",        num: "VI",       glyph: "♾️", up: "Love, harmony, relationships, values alignment, choices made from the heart.", rev: "Self-love needed, disharmony, imbalance, misalignment of values." },
      { name: "The Chariot",       num: "VII",      glyph: "🏇", up: "Control, willpower, success, determination, assertion. You are moving forward.", rev: "Self-discipline lost, opposition, lack of direction." },
      { name: "Strength",          num: "VIII",     glyph: "🦁", up: "Strength, courage, persuasion, influence, compassion. Gentle power wins.", rev: "Inner strength doubted, self-doubt, weakness, insecurity." },
      { name: "The Hermit",        num: "IX",       glyph: "🔦", up: "Soul-searching, introspection, being alone, inner guidance. Seek the light within.", rev: "Isolation, loneliness, withdrawal. Or: ready to come back.", },
      { name: "Wheel of Fortune",  num: "X",        glyph: "☸️", up: "Good luck, karma, life cycles, destiny, a turning point. The wheel always turns.", rev: "Bad luck, resistance to change, breaking cycles." },
      { name: "Justice",           num: "XI",       glyph: "⚖️", up: "Justice, fairness, truth, cause and effect, law. What is true will be known.", rev: "Unfairness, lack of accountability, dishonesty." },
      { name: "The Hanged Man",    num: "XII",      glyph: "🙃", up: "Pause, surrender, letting go, new perspectives. The wait is wisdom.", rev: "Delays, resistance, stalling, indecision." },
      { name: "Death",             num: "XIII",     glyph: "🦋", up: "Endings, change, transformation, transition. Something old must go for the new to come.", rev: "Resistance to change, inability to move on, stagnation." },
      { name: "Temperance",        num: "XIV",      glyph: "🌊", up: "Balance, moderation, patience, purpose, meaning. You are being refined.", rev: "Imbalance, excess, self-healing needed." },
      { name: "The Devil",         num: "XV",       glyph: "⛓️", up: "Shadow self, attachment, addiction, restriction, sexuality. What binds you?", rev: "Releasing limiting beliefs, exploring dark thoughts, detachment, freedom." },
      { name: "The Tower",         num: "XVI",      glyph: "⚡", up: "Sudden change, upheaval, chaos, revelation, awakening. What must fall, falls.", rev: "Personal transformation, fear of change, averting disaster." },
      { name: "The Star",          num: "XVII",     glyph: "⭐", up: "Hope, faith, purpose, renewal, spirituality. You are not alone in the dark.", rev: "Lack of faith, despair, discouragement, insecurity." },
      { name: "The Moon",          num: "XVIII",    glyph: "🌑", up: "Illusion, fear, the unconscious, confusion, complexity. Trust your instincts.", rev: "Release of fear, repressed emotion, inner confusion becoming clear." },
      { name: "The Sun",           num: "XIX",      glyph: "☀️", up: "Positivity, fun, warmth, success, vitality. Joy that is simply true.", rev: "Inner child needing attention, pessimism, unrealistic expectations." },
      { name: "Judgement",         num: "XX",       glyph: "🎺", up: "Reflection, reckoning, awakening. A call you cannot unhear. Rise.", rev: "Unable to forgive yourself, self-doubt, self-loathing." },
      { name: "The World",         num: "XXI",      glyph: "🌍", up: "Completion, integration, accomplishment, travel. You have arrived. And you begin again.", rev: "Seeking personal closure, incompletion, stagnation." },
    ];

    const SUITS = [
      { name: "Wands",   glyph: "🔥", theme: "fire, creativity, ambition, passion, action" },
      { name: "Cups",    glyph: "🌊", theme: "water, emotion, intuition, relationships, dreams" },
      { name: "Swords",  glyph: "💨", theme: "air, intellect, truth, conflict, change" },
      { name: "Pentacles",glyph:"🌱", theme: "earth, material, work, body, resources" },
    ];

    const RANKS = [
      { rank: "Ace",    up: "Pure potential. A seed. A beginning that holds everything the suit is.",    rev: "Delays, missed opportunity, emptiness." },
      { rank: "Two",    up: "Choice, balance, partnership, a decision between two equal things.",          rev: "Indecision, imbalance, blocked duality." },
      { rank: "Three",  up: "Growth, initial success, collaboration, early fruition.",                    rev: "Obstacles to growth, setbacks, delays." },
      { rank: "Four",   up: "Stability, foundation, rest, consolidation. A moment to breathe.",           rev: "Restlessness, stagnation, instability." },
      { rank: "Five",   up: "Conflict, instability, loss, challenge. Something is being tested.",         rev: "Moving on from conflict, seeking harmony." },
      { rank: "Six",    up: "Harmony restored, movement, generosity, homecoming.",                        rev: "Returning favors unfulfilled, past returning, self-care." },
      { rank: "Seven",  up: "Assessment, strategy, perseverance, a test of will.",                        rev: "Failed strategy, evasion, exhaustion." },
      { rank: "Eight",  up: "Speed, action, movement, rapid change — things are moving now.",             rev: "Delays, frustration, obstacles in the path." },
      { rank: "Nine",   up: "Resilience, courage, persistence, last stand. You have more left than you think.", rev: "Exhaustion, giving up, paranoia." },
      { rank: "Ten",    up: "Completion of a cycle. The full weight — and the full fruit — of the suit.",  rev: "Burdens, heavy loads, inability to let go." },
      { rank: "Page",   up: "Curiosity, new energy, a message. Something young and eager arrives.",       rev: "Immaturity, hasty decisions, all talk." },
      { rank: "Knight", up: "Action, adventure, momentum. Something is charging forward.",                rev: "Haste, scattered energy, off-course." },
      { rank: "Queen",  up: "Maturity, mastery of feeling and action combined. A sovereign presence.",    rev: "Coldness, dependence, inner work needed." },
      { rank: "King",   up: "Authority, mastery, command. The full expression of the suit's wisdom.",     rev: "Abuse of power, manipulation, volatility." },
    ];

    function buildDeck() {
      const deck = [];
      MAJOR.forEach(c => deck.push({ ...c, suit: "Major Arcana", isMajor: true }));
      SUITS.forEach(s => {
        RANKS.forEach(r => {
          deck.push({
            name: `${r.rank} of ${s.name}`,
            num: r.rank,
            glyph: s.glyph,
            suit: s.name,
            isMajor: false,
            up:  `${s.theme.split(',')[0].trim()} · ${r.up}`,
            rev: r.rev,
          });
        });
      });
      return deck;
    }

    const DECK = buildDeck();

    const POSITIONS = {
      1: [""],
      3: ["Past", "Present", "Future"],
      5: ["Situation", "Challenge", "Foundation", "Past Influence", "Potential"],
    };

    const NOTES = {
      1: "One card. One truth.",
      3: "What was, what is, what is becoming.",
      5: "The cross: where you stand, what opposes, what grounds, what brought you here, where you are going.",
    };

    let currentSpread = 1;

    document.querySelectorAll('.spread-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSpread = parseInt(btn.dataset.spread);
      });
    });

    function draw() {
      const used = new Set();
      const cards = [];
      while (cards.length < currentSpread) {
        const idx = Math.floor(Math.random() * DECK.length);
        if (!used.has(idx)) {
          used.add(idx);
          const reversed = Math.random() < 0.3;
          cards.push({ ...DECK[idx], reversed });
        }
      }
      return cards;
    }

    function renderCards(cards) {
      const row = document.getElementById('cardsRow');
      const positions = POSITIONS[currentSpread];
      row.innerHTML = '';

      cards.forEach((card, i) => {
        const col = document.createElement('div');
        col.className = 'card';

        const meaning = card.reversed ? card.rev : card.up;
        const revClass = card.reversed ? 'reversed' : '';
        const posLabel = positions[i] ? `<p class="card-position">${positions[i]}</p>` : '';

        col.innerHTML = `
          <div class="card-face ${revClass}">
            <div class="card-glyph">${card.glyph}</div>
            <div>
              <div class="card-name">${card.name}</div>
              <div class="card-number">${card.isMajor ? card.num + ' · ' : ''}${card.suit}</div>
              ${card.reversed ? '<div class="card-reversed-tag">Reversed</div>' : ''}
            </div>
          </div>
          ${posLabel}
          <div class="card-meaning ${revClass}"><p>${meaning}</p></div>
        `;

        row.appendChild(col);

        setTimeout(() => col.classList.add('visible'), i * 180);
      });
    }

    document.getElementById('drawBtn').addEventListener('click', () => {
      const empty = document.getElementById('emptyState');
      const row = document.getElementById('cardsRow');
      const note = document.getElementById('readingNote');

      empty.style.display = 'none';
      row.style.display = 'flex';
      note.style.display = 'block';

      const cards = draw();
      renderCards(cards);
      note.textContent = NOTES[currentSpread];
    });
  </script>
</body>
</html>
