<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Falcon — TeamSparkAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #140808; overflow: hidden; }
    canvas { display: block; }

    #hint {
      position: fixed;
      bottom: 2.5rem;
      width: 100%;
      text-align: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 0.9rem;
      color: rgba(200, 148, 58, 0.45);
      letter-spacing: 0.14em;
      pointer-events: none;
      transition: opacity 2s ease;
    }
    #hint.gone { opacity: 0; }

    #back {
      position: fixed;
      top: 2rem;
      left: 2rem;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 0.8rem;
      color: rgba(168, 197, 176, 0.35);
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: color 0.3s;
    }
    #back:hover { color: rgba(168, 197, 176, 0.8); }

    #label {
      position: fixed;
      top: 2rem;
      right: 2rem;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 0.75rem;
      color: rgba(139, 58, 42, 0.5);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a href="index.html" id="back">← return</a>
  <div id="label">for Ajah</div>
  <div id="hint">touch to reshape</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    const hint = document.getElementById('hint');

    // ── Renderer ──────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    // ── Scene & Camera ────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x140808);
    scene.fog = new THREE.FogExp2(0x140808, 0.045);

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.9, 8);
    camera.lookAt(0, 0, 0);

    // ── Lighting ──────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x0c0404, 3));

    const keyLight = new THREE.DirectionalLight(0xc8943a, 7);   // honey gold
    keyLight.position.set(3, 6, 3);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xa8c5b0, 3);  // celadon
    fillLight.position.set(-5, 1, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xc4607a, 5);   // pink
    rimLight.position.set(0, -4, -4);
    scene.add(rimLight);

    const topLight = new THREE.DirectionalLight(0xfff8f0, 1.5);
    topLight.position.set(0, 10, 0);
    scene.add(topLight);

    // ── Organic wave noise ────────────────────────────────────
    function waveNoise(x, y, z, t) {
      return (
        Math.sin(x * 2.3 + t * 0.40) * 0.38 +
        Math.sin(y * 1.9 + t * 0.58) * 0.32 +
        Math.sin(z * 2.7 + t * 0.35) * 0.22 +
        Math.sin(x * 4.1 + y * 3.3 + t * 0.50) * 0.14 +
        Math.sin(y * 5.3 + z * 2.9 + t * 0.72) * 0.09
      ) / 1.15;
    }

    // ── Wing geometry ─────────────────────────────────────────
    // Swept-back peregrine wing in soaring position.
    // Coordinate system: Z = depth (positive = toward viewer),
    //                    X = left/right, Y = up.
    function makeWing(flip) {
      const f = flip ? -1 : 1;

      const P = [
        [f*0.24,  0.02,  0.26],  // 0  front shoulder
        [f*0.24,  0.00, -0.12],  // 1  back shoulder
        [f*0.95, -0.04,  0.09],  // 2  mid leading edge
        [f*0.95, -0.08, -0.23],  // 3  mid trailing edge
        [f*1.75, -0.10, -0.06],  // 4  outer leading edge
        [f*1.75, -0.14, -0.38],  // 5  outer trailing edge
        [f*2.25, -0.16, -0.27],  // 6  wingtip
        [f*2.00, -0.19, -0.50],  // 7  trailing tip
      ];

      // Reversed winding for right wing so normals face upward on both sides
      const tris = flip
        ? [[0,1,2],[2,1,3],[2,3,4],[4,3,5],[4,5,6],[6,5,7]]
        : [[0,2,1],[2,3,1],[2,4,3],[4,5,3],[4,6,5],[6,7,5]];

      const verts = [];
      for (const [a, b, c] of tris) verts.push(...P[a], ...P[b], ...P[c]);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
      return geo;
    }

    // ── Tail feathers ─────────────────────────────────────────
    function makeTail() {
      const P = [
        [ 0.00, -0.02, -0.50],  // 0  center base
        [ 0.14,  0.00, -0.44],  // 1  right base
        [-0.14,  0.00, -0.44],  // 2  left base
        [ 0.06, -0.13, -1.08],  // 3  right tip
        [-0.06, -0.13, -1.08],  // 4  left tip
        [ 0.24, -0.05, -0.90],  // 5  right outer
        [-0.24, -0.05, -0.90],  // 6  left outer
      ];
      const tris = [[0,1,3],[0,3,4],[0,4,2],[1,5,3],[2,4,6]];
      const verts = [];
      for (const [a, b, c] of tris) verts.push(...P[a], ...P[b], ...P[c]);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
      return geo;
    }

    // ── Assemble falcon ───────────────────────────────────────
    // Body capsule lies along Z (head = +Z, tail = -Z)
    const bodyGeo = new THREE.CapsuleGeometry(0.21, 0.85, 10, 32);
    bodyGeo.rotateX(Math.PI / 2);

    const headGeo = new THREE.SphereGeometry(0.18, 32, 24);
    headGeo.translate(0, 0.06, 0.60);

    // Falcon brow ridge — gives that fierce hooded look
    const browGeo = new THREE.SphereGeometry(0.065, 16, 10);
    browGeo.scale(1.9, 0.45, 1.0);
    browGeo.translate(0, 0.22, 0.56);

    // Hooked beak
    const beakGeo = new THREE.ConeGeometry(0.055, 0.23, 8);
    beakGeo.rotateX(Math.PI / 2);
    beakGeo.rotateZ(0.28);   // downward hook
    beakGeo.translate(0, -0.005, 0.80);

    const leftWing  = makeWing(false);
    const rightWing = makeWing(true);
    const tail = makeTail();

    // Normalize all geometries: non-indexed, no UV, recompute normals
    const parts = [bodyGeo, headGeo, browGeo, beakGeo, leftWing, rightWing, tail];
    const normalized = parts.map(geo => {
      const g = geo.index ? geo.toNonIndexed() : geo;
      if (g.attributes.uv)  g.deleteAttribute('uv');
      if (g.attributes.uv2) g.deleteAttribute('uv2');
      g.computeVertexNormals();
      return g;
    });

    const falconGeo = mergeGeometries(normalized);
    falconGeo.center();

    // ── Material: dark iridescent metal ───────────────────────
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x0d0606,
      metalness: 0.93,
      roughness: 0.10,
      iridescence: 1.0,
      iridescenceIOR: 2.1,
      iridescenceThicknessRange: [80, 950],
      clearcoat: 0.5,
      clearcoatRoughness: 0.08,
    });

    const falcon = new THREE.Mesh(falconGeo, material);
    scene.add(falcon);

    // ── Store original vertex positions ───────────────────────
    const posAttr  = falconGeo.attributes.position;
    const vCount   = posAttr.count;
    const origPos  = new Float32Array(posAttr.array);
    const touchMag = new Float32Array(vCount);   // per-vertex touch displacement

    // ── Input ─────────────────────────────────────────────────
    const pointer   = new THREE.Vector2(1e6, 1e6);
    const raycaster = new THREE.Raycaster();
    let everTouched = false;

    function onMove(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
      if (!everTouched) {
        everTouched = true;
        hint.classList.add('gone');
      }
    }

    window.addEventListener('mousemove',  onMove);
    window.addEventListener('touchmove',  onMove, { passive: true });
    window.addEventListener('touchstart', onMove, { passive: true });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── Render loop ───────────────────────────────────────────
    const clock  = new THREE.Clock();
    const hitPt  = new THREE.Vector3();
    const invMat = new THREE.Matrix4();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Slow soaring rotation
      falcon.rotation.y = Math.sin(t * 0.12) * 0.38 + 0.12;
      falcon.rotation.z = Math.sin(t * 0.09) * 0.045;

      // Raycast touch
      raycaster.setFromCamera(pointer, camera);
      const hits   = raycaster.intersectObject(falcon);
      const hasHit = hits.length > 0;
      if (hasHit) {
        invMat.copy(falcon.matrixWorld).invert();
        hitPt.copy(hits[0].point).applyMatrix4(invMat);
      }

      // Deform vertices
      const noiseAmp = 0.024;
      const touchR   = 0.90;
      const touchAmp = 0.46;
      const decay    = 0.86;

      for (let i = 0; i < vCount; i++) {
        const ox = origPos[i*3], oy = origPos[i*3+1], oz = origPos[i*3+2];

        // Outward direction from centroid
        const len = Math.sqrt(ox*ox + oy*oy + oz*oz) || 1;
        const nx = ox/len, ny = oy/len, nz = oz/len;

        // Breathing noise
        const n = waveNoise(ox, oy, oz, t) * noiseAmp;

        // Touch — spring toward surface then decay back
        touchMag[i] *= decay;
        if (hasHit) {
          const dx = ox - hitPt.x, dy = oy - hitPt.y, dz = oz - hitPt.z;
          const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
          if (dist < touchR) {
            const strength = (1 - dist / touchR) ** 2 * touchAmp;
            if (strength > touchMag[i]) touchMag[i] = strength;
          }
        }

        const d = n + touchMag[i];
        posAttr.setXYZ(i, ox + nx*d, oy + ny*d, oz + nz*d);
      }

      posAttr.needsUpdate = true;
      falconGeo.computeVertexNormals();

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
